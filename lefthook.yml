# Checks come from gantry (https://github.com/guangshinhaha/gantry).
# Add or remove configs per repo. Repo-only checks go below `remotes`.
remotes:
  - git_url: https://github.com/guangshinhaha/gantry
    ref: main
    refetch_frequency: 24h
    configs:
      - hooks/base.yml
      # - hooks/node.yml   # no package.json: POSIX sh repo
      # - hooks/prisma.yml
      # - hooks/nextjs.yml

# Repo-only checks.
pre-push:
  commands:
    factory-check:
      run: sh scripts/check
      fail_text: "scripts/check failed (shellcheck or tests). Fix it; never push with --no-verify."
