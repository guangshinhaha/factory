name: ci
# Docs-only changes run only the secret scan inside the shared workflow (not with paths-ignore),
# so the required `gantry / ci-ok` check still reports.
# No `edited` here: a title or body edit would add a skipped run that resets the
# required checks (gantry#134). ci-retarget.yml re-runs this workflow when a
# PR's base changes, and the re-run tests against the new base (gantry#65).
# A draft PR runs nothing: CI proves the result once, on `ready_for_review`
# (gantry#125). Until then the required checks wait, so a draft can't merge on an old green.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels its run still in flight. Main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gantry:
    if: ${{ !github.event.pull_request.draft }}
    uses: guangshinhaha/gantry/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      node: false   # POSIX sh repo, no package.json
    # gantry:optional
    # with:
    #   runs-on: '["self-hosted","gantry"]'   # once your runner is up
    #   e2e: true
    #   node: false   # if this repo's own workflow runs its tests
    #   codegen-command: pnpm prisma generate   # fail when committed generated files are stale

  # Repo-only check: gantry's node job is off (node: false), so this repo runs
  # its own shellcheck + tests. Three OSes because the scripts must stay POSIX sh.
  check:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows Git Bash forks slowly (sf-act sim tests ~45s each, sf_ship ~8s), so test/run runs
    # every test function in parallel and prints each result as it finishes. Serial, the suite hit this 60-minute cap on PR #58 (#61). Target: under 30 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 10 }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then shellcheck --version | head -2; exit 0; fi
          case "$RUNNER_OS" in
            macOS) brew install shellcheck ;;
            Windows) choco install shellcheck -y --no-progress ;;
            *) sudo apt-get update && sudo apt-get install -y shellcheck ;;
          esac
      - name: scripts/check
        run: sh scripts/check
