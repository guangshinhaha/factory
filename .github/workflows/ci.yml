name: ci
# Docs-only changes run only the secret scan inside the shared workflow (not with paths-ignore),
# so the required `gantry / ci-ok` check still reports.
# `edited` is the only event GitHub sends when a PR's base changes, and a docs-only
# green from the old base must not stand (gantry#65). An edit that leaves the base
# alone (title, body) skips the job, so no new `ci-ok` turns a red head green, and
# its own concurrency group keeps it from cancelling the PR's real run.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A new push to a PR cancels its run still in flight. Main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gantry:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    uses: guangshinhaha/gantry/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      node: false   # POSIX sh repo, no package.json
    # gantry:optional
    # with:
    #   runs-on: '["self-hosted","gantry"]'   # once your runner is up
    #   e2e: true
    #   node: false   # if this repo's own workflow runs its tests
    #   codegen-command: pnpm prisma generate   # fail when committed generated files are stale

  # Repo-only check: gantry's node job is off (node: false), so this repo runs
  # its own shellcheck + tests. Three OSes because the scripts must stay POSIX sh.
  check:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then shellcheck --version | head -2; exit 0; fi
          case "$RUNNER_OS" in
            macOS) brew install shellcheck ;;
            Windows) choco install shellcheck -y --no-progress ;;
            *) sudo apt-get update && sudo apt-get install -y shellcheck ;;
          esac
      - name: scripts/check
        run: sh scripts/check
